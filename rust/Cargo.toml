[package]
name = "pi-dashboard-rust"
version = "0.2.1"
edition = "2021"
authors = ["RichLi4307"]
description = "Rust rewrite of the Pi Dashboard monitor mode"
license = "MIT"
repository = "https://github.com/RichLi4307/pi_dashboard"

# 依赖树刻意保持最小：纯 Rust + libc，无任何系统级 C 库。
# 新增依赖必须先在 docs/rust-coder-brief.md 中说明理由。
[dependencies]
# Async runtime —— current_thread 单线程（见 ARCHITECTURE.md §4.4）
# net: UnixListener + AsyncFd；process/sync/time: 慢通道与节拍
tokio = { version = "1", features = ["rt", "macros", "time", "process", "sync", "net", "io-util"] }

# 仅为 O_NONBLOCK 常量（触摸 fd 非阻塞）
libc = "0.2"

# Font rasterization + glyph cache
fontdue = "0.9"

# Serialization / IPC
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Time（local-offset 仅在 current_thread 单线程 runtime 下安全，勿加 rt-multi-thread）
time = { version = "0.3", features = ["local-offset", "formatting"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1"
thiserror = "2"

# PNG encoding for screenshots
png = "0.17"
base64 = "0.22"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
