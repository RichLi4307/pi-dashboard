[package]
name = "pi-dashboard-rust"
version = "0.1.0"
edition = "2021"
authors = ["RichLi4307"]
description = "Rust rewrite of the Pi Dashboard monitor mode"
license = "MIT"
repository = "https://github.com/RichLi4307/pi_dashboard"

[dependencies]
# Async runtime + subprocess + sync primitives
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "process", "sync", "fs", "io-util"] }

# Framebuffer / low-level OS
nix = { version = "0.29", features = ["mman", "fs"] }
libc = "0.2"

# Input events
evdev = "0.12"

# Font rasterization + cache
fontdue = "0.9"

# Serialization / IPC
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Time
time = { version = "0.3", features = ["local-offset", "formatting"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1"
thiserror = "1"

# PNG encoding for screenshots
png = "0.17"
base64 = "0.22"

# Small utilities
once_cell = "1"

[profile.release]
opt-level = 3
lto = true
strip = true
